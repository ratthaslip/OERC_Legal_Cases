# โหมดเริ่มต้น: HTTP พอร์ต 8080 — ใช้เมื่อ WAF / reverse proxy ของสำนักงานทำ TLS ให้แล้ว
# (ถ้าต้องการให้ nginx นี้ทำ TLS เอง ใช้ deploy/nginx/tls.conf แทน — ดู docker-compose.prod.yml)
limit_req_zone $binary_remote_addr zone=assistant:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
real_ip_header X-Forwarded-For;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;

server {
    listen 8080;
    include /etc/nginx/snippets/app.inc;
}
