# POC: ฐานข้อมูล + API + หน้าเว็บ (โหมดพัฒนา)
#   docker compose up -d --build
#   docker compose exec api python -m app.seed.seed      ← โหลดข้อมูลสาธิตครั้งแรก
#   (ถ้ามี ./data/register.xlsx จะนำเข้าทะเบียนกฎหมายลำดับรองให้ด้วย)
#   เปิด http://localhost:5173
#
# LLM/Embedding บน GPU ของตัวเอง: รัน Ollama บนเครื่อง host แล้วตั้งค่าใน .env (ดู .env.example)
services:
  db:
    image: pgvector/pgvector:pg16   # postgres 16 + pgvector (ใช้ volume เดิมได้)
    environment:
      # ตั้งรหัสผ่านที่เดายากใน .env (POSTGRES_PASSWORD) — ห้ามใช้ค่าเริ่มต้น
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ตั้ง POSTGRES_PASSWORD ใน .env}
      POSTGRES_DB: erc
    # ฐานข้อมูลเปิดเฉพาะในเครื่อง (ห้ามเปิดสู่อินเทอร์เน็ต) — container อื่นต่อผ่านเครือข่ายภายในของ docker
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ./backend
      # OCR ทางเลือก: OCR_PIP="https://github.com/Remtir/AksonOCR-Lite/archive/refs/heads/main.zip pyclipper" docker compose build api
      args: { OCR_PIP: "${OCR_PIP:-}" }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?ตั้ง POSTGRES_PASSWORD ใน .env}@db:5432/erc
      CORS_ORIGINS: http://localhost:5173
    ports: ["127.0.0.1:8000:8000"]   # หน้าเว็บเรียก API ผ่าน proxy ภายใน (API_URL) — ไม่ต้องเปิดพอร์ตนี้ออกนอกเครื่อง
    depends_on:
      db: { condition: service_healthy }
    extra_hosts: ["host.docker.internal:host-gateway"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/app/app
      - ./backend/tools:/app/tools   # เครื่องมือนำเข้า/OCR: docker compose exec api python tools/legal_import/ocr_compare.py
      - ./backend/eval:/app/eval   # ชุดคำถามทดสอบ: docker compose exec api python -m eval.run_eval --inproc --baseline eval/baseline.json
      - ./data:/data:ro        # ข้อมูลจริงของสำนักงาน (ไม่อยู่ใน git) เช่น register.xlsx
      - ./data/raw:/data/raw   # ที่เก็บไฟล์ต้นฉบับ (เขียนได้) — สำรองโฟลเดอร์นี้พร้อมฐานข้อมูลเสมอ

  web:
    image: node:22-alpine
    working_dir: /web
    environment:
      API_URL: http://api:8000
    command: sh -c "npm install && npm run dev"
    ports: ["5173:5173"]
    volumes: [./frontend:/web, webmodules:/web/node_modules]
    depends_on: [api]

  # Reranker (cross-encoder) — เปิดเมื่อต้องการ: docker compose --profile rerank up -d reranker
  # แล้วตั้ง .env: RERANK_PROVIDER=tei, RERANK_BASE_URL=http://reranker:80 และ restart api
  # มี GPU ให้ใช้ image แบบ CUDA เช่น RERANK_IMAGE=ghcr.io/huggingface/text-embeddings-inference:1.9 (+ deploy GPU)
  reranker:
    image: ${RERANK_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9}
    profiles: ["rerank"]
    command: ["--model-id", "BAAI/bge-reranker-v2-m3"]
    volumes: [hfcache:/data]   # เก็บโมเดลที่ดาวน์โหลดครั้งแรก (~2.3 GB)

volumes:
  hfcache:
  pgdata:
  webmodules:
