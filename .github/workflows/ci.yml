# ตรวจทุก PR และทุกครั้งที่ merge เข้า main:
#   1) เทสต์ backend ทั้งหมด (pytest กับ PostgreSQL จริง)
#   2) ชุดคำถามทดสอบ (golden set) — ล้มเหลวถ้าข้อที่เคยผ่านใน eval/baseline.json กลับไม่ผ่าน
#   3) build หน้าเว็บ
# ไม่ใช้ทะเบียนจริงของสำนักงาน (ข้อมูลภายใน) — eval รันโหมด public ข้ามข้อที่ต้องใช้ทะเบียน
# ไม่เรียก LLM/embedding ภายนอก (LLM_PROVIDER=extractive, EMBED_PROVIDER=hash)
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16   # เหมือน docker-compose (มี pgvector)
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/erc
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/erc_test
      RAW_STORE_DIR: /tmp/rawstore
      LLM_PROVIDER: extractive
      EMBED_PROVIDER: hash
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: dependency vulnerabilities (pip-audit)
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: poppler (PDF rendering for OCR tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: create test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE erc_test"
      - name: tests
        run: python -m pytest -q
      - name: seed (public data only)
        run: python -m app.seed.seed
      - name: golden set (no regression vs baseline)
        run: python -m eval.run_eval --inproc --mode public --baseline eval/baseline.json --out /tmp/eval-results.json
      - name: upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: /tmp/eval-results.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: dependency vulnerabilities (npm audit, production deps)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  # ชุดติดตั้งระบบจริง (docker-compose.prod.yml): build image, เปิดบริการ, ตรวจ health / header / ผู้ใช้ไม่ใช่ root
  production-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: prepare .env and data folders
        run: |
          cat > .env <<'ENV'
          POSTGRES_PASSWORD=ci-prod-password-0123456789
          CONFIG_SECRET=ci-config-secret-0123456789abcdef
          LLM_PROVIDER=extractive
          EMBED_PROVIDER=hash
          HTTP_PORT=8088
          ENV
          mkdir -p data/raw data/laws-internal data/import data/models
          sudo chown -R 10001:10001 data/raw
      - name: build and start
        run: docker compose -f docker-compose.prod.yml up -d --build --wait --wait-timeout 900
      - name: import laws (production command)
        run: docker compose -f docker-compose.prod.yml exec -T api python -m app.seed.seed --laws-only
      - name: demo seed is refused in production
        run: |
          if docker compose -f docker-compose.prod.yml exec -T api python -m app.seed.seed; then
            echo "demo seed must not run when APP_ENV=production"; exit 1
          fi
      - name: smoke test through nginx
        run: |
          set -e
          curl -fsS http://localhost:8088/api/v1/health | grep '"db":true'
          curl -fsS "http://localhost:8088/api/v1/laws/search?q=%E0%B8%AD%E0%B8%B8%E0%B8%97%E0%B8%98%E0%B8%A3%E0%B8%93%E0%B9%8C" | grep -q eli
          curl -fsS -D headers.txt -o index.html http://localhost:8088/
          grep -qi '^content-security-policy:' headers.txt
          grep -qi '^x-frame-options: DENY' headers.txt
          grep -q 'id="root"' index.html
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/docs)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/api/v1/laws/register?offset=-1)" = 400
      - name: uploads are virus-scanned (ClamAV, EICAR test file)
        run: |
          set -e
          python3 - <<'PY'
          import zipfile
          eicar = "X5O!P%@AP[4\\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*"
          for name, extra in (("clean.docx", {}), ("eicar.docx", {"word/media/eicar.com": eicar})):
              with zipfile.ZipFile(name, "w", zipfile.ZIP_STORED) as z:
                  z.writestr("[Content_Types].xml", "<Types/>")
                  z.writestr("word/document.xml", "<w:document/>")
                  for k, v in extra.items():
                      z.writestr(k, v)
          PY
          up() { curl -s -o /dev/null -w '%{http_code}' -H 'X-Demo-User: lgl1' -F "file=@$1" -F 'doc_type=ประกาศ' http://localhost:8088/api/v1/laws/uploads; }
          test "$(up eicar.docx)" = 422
          test "$(up clean.docx)" = 200
      - name: containers run as non-root
        run: |
          test "$(docker compose -f docker-compose.prod.yml exec -T api id -u)" = 10001
          test "$(docker compose -f docker-compose.prod.yml exec -T web id -u)" != 0
      - name: logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --tail=200
