# ตรวจทุก PR และทุกครั้งที่ merge เข้า main:
#   1) เทสต์ backend ทั้งหมด (pytest กับ PostgreSQL จริง)
#   2) ชุดคำถามทดสอบ (golden set) — ล้มเหลวถ้าข้อที่เคยผ่านใน eval/baseline.json กลับไม่ผ่าน
#   3) build หน้าเว็บ
# ไม่ใช้ทะเบียนจริงของสำนักงาน (ข้อมูลภายใน) — eval รันโหมด public ข้ามข้อที่ต้องใช้ทะเบียน
# ไม่เรียก LLM/embedding ภายนอก (LLM_PROVIDER=extractive, EMBED_PROVIDER=hash)
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16   # เหมือน docker-compose (มี pgvector)
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/erc
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/erc_test
      RAW_STORE_DIR: /tmp/rawstore
      LLM_PROVIDER: extractive
      EMBED_PROVIDER: hash
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: create test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE erc_test"
      - name: tests
        run: python -m pytest -q
      - name: seed (public data only)
        run: python -m app.seed.seed
      - name: golden set (no regression vs baseline)
        run: python -m eval.run_eval --inproc --mode public --baseline eval/baseline.json --out /tmp/eval-results.json
      - name: upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: /tmp/eval-results.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
