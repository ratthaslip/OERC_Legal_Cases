# Alembic — การเปลี่ยนโครงสร้างฐานข้อมูลของระบบที่ใช้งานจริง
#   alembic upgrade head      ปรับฐานข้อมูลให้เป็นรุ่นล่าสุด (รันทุกครั้งก่อนเปิดบริการรุ่นใหม่)
#   alembic current           ดูรุ่นปัจจุบัน
#   alembic revision -m "…"   สร้างไฟล์ migration ใหม่ (ต้องแก้ app/schema.sql ให้ตรงกันด้วย)
# URL ฐานข้อมูลอ่านจาก DATABASE_URL (ไม่ใส่ในไฟล์นี้)
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
