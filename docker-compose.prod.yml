# ระบบจริงบน VM ของสำนักงาน (ไม่ใช้ร่วมกับ docker-compose.yml ซึ่งเป็นโหมดพัฒนา)
#
#   cp .env.example .env            # ตั้ง POSTGRES_PASSWORD, CONFIG_SECRET, *_ALLOWED_BASE_URLS, LLM_* ฯลฯ
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec api python -m app.seed.seed --laws-only   # นำเข้าตัวบท + ทะเบียน
#
# - API ปรับโครงสร้างฐานข้อมูล (alembic upgrade head) ให้เองทุกครั้งที่เริ่ม
# - หน้าเว็บ: http://<เครื่อง>:80 (WAF/reverse proxy ของสำนักงานทำ TLS) หรือเปิด TLS ที่ nginx นี้ — ดูบริการ web
# - ไม่มีพอร์ตฐานข้อมูลหรือ API เปิดออกนอกเครื่อง; ทุกบริการเริ่มเองหลังรีบูต
# - ฐานข้อมูลแยกเครื่อง (VM DB): ลบบริการ db แล้วตั้ง EXTERNAL_DATABASE_URL ใน .env ให้ชี้ไปเครื่องนั้น
#   (ใช้ผู้ใช้ฐานข้อมูลของแอปที่ไม่ใช่ superuser)
name: erc-prod

x-restart: &restart
  restart: unless-stopped

services:
  db:
    <<: *restart
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ตั้ง POSTGRES_PASSWORD ใน .env}
      POSTGRES_DB: erc
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 10
    networks: [backend]

  api:
    <<: *restart
    build:
      context: ./backend
      args: { OCR_PIP: "${OCR_PIP:-}" }
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: ${EXTERNAL_DATABASE_URL:-postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/erc}
      CORS_ORIGINS: ""            # หน้าเว็บและ API อยู่โดเมนเดียวกัน
      AV_SCAN: ${AV_SCAN:-required}   # ไฟล์อัปโหลดต้องผ่าน ClamAV (clamd ไม่พร้อม = ไม่รับไฟล์)
      CLAMD_HOST: clamav
      # สำเนา audit log: stdout (ระบบรวม log) + ไฟล์บนดิสก์แยก; เพิ่ม syslog+tcp://<SIEM>:514 ได้
      AUDIT_SINK: ${AUDIT_SINK:-log,file:/data/audit/audit.jsonl}
    depends_on:
      db: { condition: service_healthy }
    read_only: true               # เขียนได้เฉพาะ volume ด้านล่างและ tmpfs
    tmpfs: ["/tmp:size=2g", "/home/app:size=256m,uid=10001,gid=10001"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    volumes:
      - ./data/raw:/data/raw                          # คลังไฟล์ต้นฉบับ (เขียนได้) — chown 10001 ก่อนเริ่มครั้งแรก
      - ${AUDIT_DIR:-./data/audit}:/data/audit        # สำเนา audit log (เขียนได้, chown 10001) — ควรเป็นดิสก์/NFS แยกจากฐานข้อมูล
      - ./data/laws-internal:/data/laws-internal:ro   # ตราสารภายใน (ชุดไฟล์จากฝ่ายกฎหมาย)
      - ./data/import:/data/import:ro                 # ไฟล์ทะเบียน Excel ที่จะนำเข้า (REGISTER_XLSX=/data/import/register.xlsx)
      - ./data/models:/data/models:ro                 # น้ำหนักโมเดล OCR (ถ้าใช้ AksonOCR-Lite)
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [backend, frontend]

  # สแกนไวรัสไฟล์อัปโหลด — ดาวน์โหลดฐานข้อมูลไวรัส (freshclam) จาก database.clamav.net ทุกวัน
  # เครือข่ายที่ออกอินเทอร์เน็ตไม่ได้: ตั้ง private mirror (FRESHCLAM_CONF_PrivateMirror) หรือ AV_SCAN=off พร้อมสแกนที่ gateway แทน
  clamav:
    <<: *restart
    image: clamav/clamav:1.4
    environment:
      CLAMD_CONF_StreamMaxLength: 60M     # ไฟล์อัปโหลดสูงสุด 50 MB
      CLAMD_CONF_MaxFileSize: 60M
      CLAMD_CONF_MaxScanSize: 200M
    volumes: [clamdb:/var/lib/clamav]
    networks: [backend]

  web:
    <<: *restart
    build: ./frontend
    depends_on:
      api: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx:uid=101,gid=101"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    ports:
      - "${HTTP_PORT:-80}:8080"
      # TLS ที่ nginx นี้ (ไม่ผ่าน WAF): เปิดสองบรรทัดล่าง และวางใบรับรองใน deploy/certs/
      # - "${HTTPS_PORT:-443}:8443"
    # volumes:
    #   - ./deploy/nginx/tls.conf:/etc/nginx/conf.d/default.conf:ro
    #   - ./deploy/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      retries: 3
    networks: [frontend]

networks:
  backend:
  frontend:

volumes:
  pgdata:
  clamdb:
